# Render Blueprint — free-tier demo
# Important free limits:
# - Web services sleep after ~15 min idle (~1 min wake)
# - Free web services CANNOT receive private-network traffic → use public HTTPS URLs
# - Free services have NO Shell / one-off jobs → ingest from your laptop (see README)
# - Free Postgres expires after 30 days

databases:
  - name: telco-db
    plan: free
    databaseName: telco
    postgresMajorVersion: "16"

services:
  - type: web
    name: telco-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: VECTOR_BACKEND
        value: pgvector
      - key: DATABASE_URL
        fromDatabase:
          name: telco-db
          property: connectionString
      # Public hostname (free services cannot receive private-network calls)
      - key: CORS_ORIGINS
        fromService:
          name: telco-web
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEYS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CHAT_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"

  - type: web
    name: telco-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Must be the PUBLIC API host — free APIs ignore private-network requests
      - key: TELCO_API_URL
        fromService:
          name: telco-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: TELCO_API_KEY
        sync: false
